<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337" />
      <stop offset="45%" stop-color="#991b1b" />
      <stop offset="80%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="tileBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fdf2f4" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Container: Premium Rounded Square (Squircle) -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#bgGrad)" />
  
  <!-- Subtle Outer Border Glow -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="none" stroke="url(#tileBorderGrad)" stroke-width="8" />

  <!-- Subtle 2x2 Ceramic Tile Grid Pattern in Background -->
  <rect x="42" y="42" width="208" height="208" rx="24" ry="24" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3" />
  <rect x="262" y="42" width="208" height="208" rx="24" ry="24" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3" />
  <rect x="42" y="262" width="208" height="208" rx="24" ry="24" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3" />
  <rect x="262" y="262" width="208" height="208" rx="24" ry="24" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3" />

  <!-- Central RT Typography (Bold, Modern, Maximum Legibility at 16x16 & 32x32) -->
  <g filter="url(#shadow)">
    <!-- R (x: 104 to 252, y: 140 to 372) -->
    <path d="M 104 140 L 204 140 C 238 140 254 162 254 196 C 254 222 238 240 214 246 L 256 372 L 202 372 L 164 260 L 156 260 L 156 372 L 104 372 Z M 156 216 L 198 216 C 210 216 218 208 218 198 C 218 186 210 180 198 180 L 156 180 Z" fill="url(#textGrad)" />

    <!-- T (x: 260 to 408, y: 140 to 372) -->
    <path d="M 260 140 L 408 140 L 408 184 L 360 184 L 360 372 L 308 372 L 308 184 L 260 184 Z" fill="url(#textGrad)" />
  </g>
</svg>